openapi: 3.0.1
info:
  title: Translator
  description: API for managing translations.
  version: 1.0.0
servers:
  - url: http://localhost:5500

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login and receive a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Successful login returns a JWT token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  /organisations:
    get:
      tags:
        - Organisations
      summary: Retrieve a list of organisations for the auth user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A list of organisations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organisation"
    post:
      tags:
        - Organisations
      summary: Create a new organisation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationCreate"
      responses:
        "201":
          description: Organisation created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
  /organisations/{id}:
    get:
      tags:
        - Organisations
      summary: Retrieve a specific organisation by ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The organisation ID.
      responses:
        "200":
          description: Organisation found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "404":
          description: Organisation not found.
    put:
      tags:
        - Organisations
      summary: Update an organisation.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The organisation ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Organisation"
      responses:
        "200":
          description: Organisation updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
    delete:
      tags:
        - Organisations
      summary: Delete an organisation.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The organisation ID.
      responses:
        "204":
          description: Organisation deleted successfully.
  /organisations/{id}/invitations:
      post:
        tags:
          - Invitations
        summary: Send an invitation to join an organisation
        operationId: sendInvitation
        tags:
          - Invitations
        parameters:
          - name: organisationId
            in: path
            required: true
            description: The ID of the organisation
            schema:
              type: string
        requestBody:
          description: Invitation details
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendInvitationRequest'
        responses:
          '201':
            description: Invitation sent successfully.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/InvitationResponse'
          '400':
            description: Validation error.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          '401':
            description: Unauthorized.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

  /invitations/accept:
    get:
      tags:
        - Invitations
      summary: Accept an invitation using a token
      operationId: acceptInvitation
      tags:
        - Invitations
      parameters:
        - name: token
          in: query
          required: true
          description: The unique invitation token.
          schema:
            type: string
      responses:
        '200':
          description: Invitation accepted. The user is added to the organisation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          description: Invalid or expired invitation token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Login:
      type: object
      properties:
        email:
          type: string
          example: holder.nikolai@gmail.com
        password:
          type: string
          example: password
    Organisation:
      type: object
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: "Acme Corporation"
    OrganisationCreate:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          example: "Acme Corporation"
        description:
          type: string
          example: "This is an example description"
    OrganisationUpdate:
      type: object
      properties:
        name:
          type: string
          example: "Acme Corporation Updated"
    SendInvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email address of the invitee.
          example: invitee@example.com
        expires_at:
          type: string
          format: date-time
          description: >
            Optional expiration date/time for the invitation.
            Must be a valid ISO 8601 date-time in the future.
          example: "2025-01-01T00:00:00Z"
      required:
        - email

    Invitation:
      type: object
      properties:
        id:
          type: integer
          example: 123
        organisation_id:
          type: integer
          example: 456
        invited_by:
          type: string
          description: The ID of the user who sent the invitation.
          example: "user_abc123"
        email:
          type: string
          format: email
          example: invitee@example.com
        token:
          type: string
          description: Unique invitation token.
          example: "randomly-generated-token"
        status:
          type: string
          description: The current status of the invitation.
          enum: [pending, accepted, expired]
          example: "pending"
        expires_at:
          type: string
          format: date-time
          description: Expiration date/time of the invitation.
          example: "2025-01-01T00:00:00Z"
        created_at:
          type: string
          format: date-time
          example: "2023-04-27T12:34:56Z"
        updated_at:
          type: string
          format: date-time
          example: "2023-04-27T12:34:56Z"

    InvitationResponse:
      type: object
      properties:
        message:
          type: string
          example: "Invitation sent successfully"
        data:
          $ref: '#/components/schemas/Invitation'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Validation error"
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                example: "email"
              message:
                type: string
                example: "Invalid email address"
tags:
  - name: Auth
    description: Endpoints for managing auth
  - name: Organisations
    description: Endpoints for managing organisations.
  - name: Invitations
    description: Endpoints for managing invitations.
