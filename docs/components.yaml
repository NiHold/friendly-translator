securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT
schemas:
  Login:
    type: object
    properties:
      email:
        type: string
        example: holder.nikolai@gmail.com
      password:
        type: string
        example: password
  Organisation:
    type: object
    properties:
      id:
        type: string
        example: "1"
      name:
        type: string
        example: "Acme Corporation"
  OrganisationCreate:
    type: object
    required:
      - name
      - description
    properties:
      name:
        type: string
        example: "Acme Corporation"
      description:
        type: string
        example: "This is an example description"
  OrganisationUpdate:
    type: object
    properties:
      name:
        type: string
        example: "Acme Corporation Updated"
