get:
  tags:
    - Organisations
  summary: Retrieve a specific organisation by ID.
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The organisation ID.
  responses:
    "200":
      description: Organisation found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Organisation"
    "404":
      description: Organisation not found.
put:
  tags:
    - Organisations
  summary: Update an organisation.
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The organisation ID.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Organisation"
  responses:
    "200":
      description: Organisation updated successfully.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Organisation"
delete:
  tags:
    - Organisations
  summary: Delete an organisation.
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The organisation ID.
  responses:
    "204":
      description: Organisation deleted successfully.
