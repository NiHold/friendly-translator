get:
  tags:
    - Organisations
  summary: Retrieve a list of organisations for the auth user.
  security:
    - bearerAuth: []
  responses:
    "200":
      description: A list of organisations.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Organisation"
post:
  tags:
    - Organisations
  summary: Create a new organisation.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/OrganisationCreate"
  responses:
    "201":
      description: Organisation created successfully.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Organisation"
